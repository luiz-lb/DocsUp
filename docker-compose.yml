# DocsUp: banco (SQL Server 2022), inicialização do banco, backend, frontend, Kafka e o
# serviço de notificações (notifier).
# Antes de subir: copie .env.example para .env (nesta pasta) e preencha.

name: docsup

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      # Só no 127.0.0.1 da máquina (SSMS / Azure Data Studio), com porta diferente de 1433
      # para não conflitar com um SQL Server local. No SSMS: "127.0.0.1,14330" (vírgula).
      - "127.0.0.1:${DB_HOST_PORT:-14330}:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # Roda o database/init-db.sh e termina: cria o database, aplica schema/seed/migrações
  # e o login da aplicação. Idempotente; roda a cada `docker compose up`.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no .env}
      DB_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE no .env}
      DB_USERENV: ${DB_USERENV:?Defina DB_USERENV no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - ./database:/database:ro
    # Remove \r antes de executar, caso o script tenha sido salvo com fim de linha do Windows
    entrypoint: ["/bin/bash", "-c", "tr -d '\\r' < /database/init-db.sh > /tmp/init-db.sh && exec /bin/bash /tmp/init-db.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3003"
      TZ: ${TZ:-America/Sao_Paulo}
      # Usuário da aplicação (permissão mínima). O backend nunca usa o sa.
      DB_SERVER: db
      DB_PORT: "1433"
      DB_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE no .env}
      DB_USERENV: ${DB_USERENV:?Defina DB_USERENV no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      DB_ENCRYPT: ${DB_ENCRYPT:-true}
      DB_TRUST_CERT: ${DB_TRUST_CERT:-true}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      SUPPLIER_JWT_SECRET: ${SUPPLIER_JWT_SECRET:?Defina SUPPLIER_JWT_SECRET no .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Defina WEBHOOK_SECRET no .env}
      FRONTEND_URL: ${FRONTEND_URL:?Defina FRONTEND_URL no .env}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: ${TRUST_PROXY:-}
      USER_ADMIN: ${USER_ADMIN:-}
      SENHA_ADMIN: ${SENHA_ADMIN:-}
      # E-mail pelo Microsoft Graph (caixa GRAPH_SENDER). Quem envia é o notifier.
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SENDER: ${GRAPH_SENDER:-}
      MAIL_SECRET_KEY: ${MAIL_SECRET_KEY:-}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      MAIL_COMPANY_NAME: ${MAIL_COMPANY_NAME:-}
      SUPRIMENTOS_EMAIL: ${SUPRIMENTOS_EMAIL:-}
      HUBDEV_TOKEN: ${HUBDEV_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-3003}:3003"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  # Kafka (modo KRaft, sem Zookeeper), só na rede interna do Docker. Os eventos de notificação
  # passam por aqui: a API grava na outbox, o notifier publica e consome.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Mensagens ficam 7 dias no Kafka (o histórico dos envios fica no banco)
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      # ID do cluster (UUID em base64, 22 caracteres). Fixo: o volume guarda os dados com ele.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-kC_h7j81nInRVP_M2Kt0Uw}
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Serviço de notificações: mesmo código do backend, outro processo (node notifier.js).
  # Publica no Kafka os eventos da outbox, consome e envia os e-mails (novas tentativas e fila
  # de erro), e roda o agendador (prazos, calendário dos mensais e resumo do RH).
  notifier:
    build:
      context: ./backend
    command: ["node", "--disable-warning=TimeoutNegativeWarning", "notifier.js"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-America/Sao_Paulo}
      DB_SERVER: db
      DB_PORT: "1433"
      DB_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE no .env}
      DB_USERENV: ${DB_USERENV:?Defina DB_USERENV no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      DB_ENCRYPT: ${DB_ENCRYPT:-true}
      DB_TRUST_CERT: ${DB_TRUST_CERT:-true}
      KAFKA_BROKERS: kafka:9092
      FRONTEND_URL: ${FRONTEND_URL:?Defina FRONTEND_URL no .env}
      # E-mail pelo Microsoft Graph (caixa GRAPH_SENDER). Quem envia é o notifier.
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SENDER: ${GRAPH_SENDER:-}
      MAIL_SECRET_KEY: ${MAIL_SECRET_KEY:-}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
      MAIL_COMPANY_NAME: ${MAIL_COMPANY_NAME:-}
      SUPRIMENTOS_EMAIL: ${SUPRIMENTOS_EMAIL:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_URL_BACKEND: ${VITE_URL_BACKEND:?Defina VITE_URL_BACKEND no .env}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  kafka-data:
